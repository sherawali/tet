name: tet_app
description: "TET Rank - UTET & CTET 2026 preparation: solved papers, mocks, subject drills and result analytics. Offline-first, one flagship paper free."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_math_fork: ^0.7.4
  google_fonts: ^8.2.1
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  in_app_update: ^4.2.5
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/database/
  # The typography is bundled so the app keeps its premium look without a
  # network connection.  All three faces are variable fonts, the weight is
  # selected through the "wght" axis.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
