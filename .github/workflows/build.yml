name: Build Question Bank

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

# एक समय में एक ही run — आपस में टकराव नहीं होगा
concurrency:
  group: build-bank
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch on this Arena branch is reserved for the public-source
    # recovery probe below. The production bank build remains main-push only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build packs
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main          # हमेशा सबसे नए main से शुरू करो
          export BANK_VERSION=$(git rev-list --count HEAD)
          export BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BANK_VERSION=$BANK_VERSION" >> "$GITHUB_ENV"
          python tools/build.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name  "bank-bot"
          git config user.email "bank-bot@users.noreply.github.com"
          git add -A cdn

          if git diff --staged --quiet; then
            echo "कुछ नहीं बदला — push की ज़रूरत नहीं"
          else
            git commit -m "bank v${BANK_VERSION}"
            # तीन कोशिशें — बीच में कोई और push कर दे तो भी चल जाए
            for i in 1 2 3; do
              echo "कोशिश $i ..."
              git fetch origin main
              git rebase origin/main || git rebase --abort || true
              if git push origin HEAD:main; then
                echo "✅ push हो गया"
                break
              fi
              echo "टकराव हुआ, 5 सेकंड बाद दोबारा..."
              sleep 5
            done
          fi

          git tag -f "v${BANK_VERSION}"
          git push -f origin "refs/tags/v${BANK_VERSION}"
          echo "🏷️  tag v${BANK_VERSION} लग गया"

      - name: Purge jsDelivr cache
        continue-on-error: true
        shell: bash
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/cdn/manifest.json" || true
          echo ""

  probe-public-paper-source:
    # The Arena sandbox cannot negotiate TLS with the public Prepp CDN. Run a
    # metadata-only browser probe on GitHub's runner; no credentials or browser
    # storage are printed. This branch-only diagnostic never writes to main.
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'arena/01a1044b-tet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Arena branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser probe
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Probe public paper page
        run: python tools/v2/probe_prepp_paper.py
