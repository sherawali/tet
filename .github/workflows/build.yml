name: Build Question Bank

on:
  push:
    branches: [main]
    paths:
      - 'bank-v2/**'
      - 'tools/v2/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

# एक समय में एक ही run — आपस में टकराव नहीं होगा
concurrency:
  group: build-bank
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The legacy content/ + tools/build.py pipeline no longer exists in this repo.
      # bank-v2 NDJSON is the source of truth; the v2 tools build SQLite and the packs.
      - name: Validate and test
        run: |
          python tools/v2/validate_structure.py
          python tools/v2/validate_stimulus_groups.py
          python tools/v2/sanitize_bank.py --check
          python tools/v2/test_text_sanitizer.py
          python tools/v2/test_app_build.py

      - name: Build SQLite and CDN packs
        run: |
          python tools/v2/build_app_db.py
          python tools/v2/build_cdn_packs.py

      - name: Refresh stimulus-link audit reports
        # --fail-on never keeps the build green while the placeholder passages of
        # 2016/2018/2019/2021/2023/2024/2026 are still unfixed. Drop the flag (the
        # default is --fail-on definite) once real passage text is imported.
        run: python tools/v2/audit_stimulus_links.py --fail-on never

      - name: Commit and push
        run: |
          git config user.name  "bank-bot"
          git config user.email "bank-bot@users.noreply.github.com"
          git add -A cdn bank-v2/audits/stimulus-links

          if git diff --staged --quiet; then
            echo "कुछ नहीं बदला — push की ज़रूरत नहीं"
          else
            BANK_VERSION=$(python -c "import sys;sys.path.insert(0,'tools/v2');import build_config;print(build_config.BANK_VERSION)")
            git commit -m "bank v${BANK_VERSION}"
            # तीन कोशिशें — बीच में कोई और push कर दे तो भी चल जाए
            for i in 1 2 3; do
              echo "कोशिश $i ..."
              git fetch origin main
              git rebase origin/main || git rebase --abort || true
              if git push origin HEAD:main; then
                echo "✅ push हो गया"
                break
              fi
              echo "टकराव हुआ, 5 सेकंड बाद दोबारा..."
              sleep 5
            done
            git tag -f "bank-${BANK_VERSION}"
            git push -f origin "refs/tags/bank-${BANK_VERSION}"
            echo "🏷️  tag bank-${BANK_VERSION} लग गया"
          fi

      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/cdn/manifest.json" || true
          echo ""
