name: Build Question Bank
on:
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # हर push = नया version number
      - name: Version
        run: |
          echo "BANK_VERSION=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build packs
        run: python tools/build.py       # गलती हुई तो यहीं फेल, खराब डेटा कभी live नहीं जाएगा

      - name: Commit cdn
        run: |
          git config user.name  "bank-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A cdn
          git diff --staged --quiet || git commit -m "bank v${{ env.BANK_VERSION }}"
          git push

      # tag = jsDelivr पर हमेशा-के-लिए cache होने वाला immutable URL
      - name: Tag release
        run: |
          git tag -f v${{ env.BANK_VERSION }}
          git push -f origin v${{ env.BANK_VERSION }}

      # jsDelivr का cache साफ़ करो, वरना @main 12 घंटे पुराना दिखता रहेगा
      - name: Purge jsDelivr cache
        run: |
          R="${{ github.repository }}"
          for f in "cdn/manifest.json" ""; do
            curl -s "https://purge.jsdelivr.net/gh/${R}@main/${f}" -o /dev/null || true
          done
          sleep 3
          echo "cache साफ़ — नया manifest:"
          curl -s "https://cdn.jsdelivr.net/gh/${R}@main/cdn/manifest.json" | head -c 120 || true

      - name: Summary
        run: |
          echo "### ✅ Bank v${{ env.BANK_VERSION }} live" >> $GITHUB_STEP_SUMMARY
          python -c "import json;m=json.load(open('cdn/manifest.json'));print(f\"- {m['total']} questions, {len(m['packs'])} packs\")" >> $GITHUB_STEP_SUMMARY
