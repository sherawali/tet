name: Build Question Bank

# The app reads only `cdn/` off jsDelivr (`/runtime/` is gitignored), so this
# workflow is the release pipeline: bank-v2 in, cdn out, tag pushed, cache purged.
#
# It used to watch `content/**` and run `tools/build.py` - the CSV-era layout that
# no longer exists - which is why two weeks of bank fixes never reached a device.
on:
  push:
    branches: [main]
    paths:
      - 'bank-v2/**'
      - 'tools/**'
      - 'verify_all_questions.py'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'bank-v2/**'
      - 'tools/**'
      - 'verify_all_questions.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

# एक समय में एक ही run — आपस में टकराव नहीं होगा
concurrency:
  group: build-bank
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pin the release stamp once so the SQLite meta row, the manifest and the
      # git tag all carry the same number. UTC hour: monotonic, collision-free
      # for any realistic release cadence, and always greater than what an app
      # already stored - which is the whole condition the app checks first.
      - name: Pin release stamp
        shell: bash
        run: |
          STAMP=$(date -u +%Y%m%d%H)
          echo "BANK_VERSION=$STAMP" >> "$GITHUB_ENV"
          echo "🔖 release stamp v$STAMP"

      - name: Gate — all 7 integrity checks must pass
        shell: bash
        run: python verify_all_questions.py

      - name: Build app database
        shell: bash
        run: python tools/v2/build_app_db.py

      - name: Build CDN packs + manifest
        shell: bash
        run: python tools/v2/build_cdn_packs.py

      - name: Prune superseded packs
        shell: bash
        run: python tools/v2/prune_stale_packs.py

      # Everything below is a release step: pull requests get the validation only.
      - name: Commit and push
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name  "bank-bot"
          git config user.email "bank-bot@users.noreply.github.com"
          git add -A cdn

          if git diff --staged --quiet; then
            echo "cdn नहीं बदला — push की ज़रूरत नहीं"
          else
            git commit -m "bank v${BANK_VERSION}"
            # तीन कोशिशें — बीच में कोई और push कर दे तो भी चल जाए
            for i in 1 2 3; do
              echo "कोशिश $i ..."
              git fetch origin main
              git rebase origin/main || git rebase --abort || true
              if git push origin HEAD:main; then
                echo "✅ push हो गया"
                break
              fi
              echo "टकराव हुआ, 5 सेकंड बाद दोबारा..."
              sleep 5
            done
          fi

          git tag -f "v${BANK_VERSION}"
          git push -f origin "refs/tags/v${BANK_VERSION}"
          echo "🏷️  tag v${BANK_VERSION} लग गया"

      - name: Purge jsDelivr cache
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/cdn/manifest.json" || true
          echo ""
