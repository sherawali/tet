name: Fetch CTET sources

on:
  push:
    branches: [arena/01a10471-tet]
    paths: ['.github/workflows/fetch-ctet-sources.yml', 'tools/fetch_ctet_run4.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ctet-sources
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a10471-tet

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng file
          pip install --quiet pdfplumber gdown

      - name: Fetch and extract
        run: python tools/fetch_ctet_run4.py

      - name: Commit results
        shell: bash
        run: |
          git config user.name  "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add ctetnew/_sources
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            git commit -m "chore: fetched CTET official sources (text extracts) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin arena/01a10471-tet || git rebase --abort || true
              git push origin arena/01a10471-tet && break
              sleep 5
            done
          fi
