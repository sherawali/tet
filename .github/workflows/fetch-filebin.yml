name: fetch-filebin
# v3: span-level extraction with font names
on:
  workflow_dispatch:
  push:
    branches: [ "arena/01a0fbb2-tet" ]
    paths: [ ".github/workflows/fetch-filebin.yml" ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0fbb2-tet
      - name: Download filebin archive
        run: |
          mkdir -p /tmp/pdfs
          curl -sL -A "curl/8.5.0" -o /tmp/pdfs.tar "https://filebin.net/archive/jpczx4symu5d277x/tar"
          tar -xf /tmp/pdfs.tar -C /tmp/pdfs
          ls -la /tmp/pdfs
      - name: Extract spans with fonts
        run: |
          pip install --quiet pymupdf
          python3 - <<'EOF'
          import pymupdf, os, glob, json, gzip, collections
          os.makedirs("tmp_spans", exist_ok=True)
          for p in sorted(glob.glob("/tmp/pdfs/*.pdf")):
              name = os.path.splitext(os.path.basename(p))[0]
              try:
                  doc = pymupdf.open(p)
                  fonts = collections.Counter()
                  with gzip.open(f"tmp_spans/{name}.jsonl.gz", "wt", encoding="utf-8") as f:
                      for pageno, page in enumerate(doc):
                          d = page.get_text("dict")
                          for block in d["blocks"]:
                              if block.get("type") != 0:
                                  continue
                              for line in block["lines"]:
                                  spans = []
                                  for s in line["spans"]:
                                      spans.append({"f": s["font"], "t": s["text"]})
                                      fonts[s["font"]] += len(s["text"])
                                  rec = {"p": pageno + 1,
                                         "x": round(line["bbox"][0], 1),
                                         "y": round(line["bbox"][1], 1),
                                         "s": spans}
                                  f.write(json.dumps(rec, ensure_ascii=False) + "\n")
                  print("==", name, len(doc), "pages")
                  for fn, c in fonts.most_common(12):
                      print("   font:", fn, c)
              except Exception as e:
                  print("FAIL", name, e)
          EOF
      - name: Commit extracted spans
        run: |
          git config user.name "filebin-fetch-bot"
          git config user.email "bot@example.com"
          git pull --rebase origin arena/01a0fbb2-tet || true
          git add tmp_spans
          git commit -m "tmp: span-level extraction with fonts"
          git push origin arena/01a0fbb2-tet
