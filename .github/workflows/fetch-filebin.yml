name: fetch-filebin
on:
  workflow_dispatch:
  push:
    branches: [ "arena/01a0fbb2-tet" ]
    paths: [ ".github/workflows/fetch-filebin.yml" ]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download filebin archive
        run: |
          mkdir -p pdfs
          curl -sL -A "curl/8.5.0" -o pdfs.tar "https://filebin.net/archive/jpczx4symu5d277x/tar"
          tar -xf pdfs.tar -C pdfs
          ls -la pdfs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: filebin-pdfs
          path: pdfs/
          compression-level: 6
